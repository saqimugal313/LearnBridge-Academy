services:
  mongo:
    image: mongo:6.0-jammy
    ports:
      - "27017:27017"
    volumes:
      - learnbridge_db_data:/data/db

  server:
    build: ./server
    command: npm run dev
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/learnbridge
      - PORT=5000
    depends_on:
      - mongo
    volumes:
      # This bind mount syncs your local folder to the container for live-reloading
      - ./server:/usr/src/app
      - /usr/src/app/node_modules

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      # Forces Vite to watch for file changes inside the Docker container
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server
    volumes:
      # Syncs your frontend code for live-reloading
      - ./client:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  learnbridge_db_data:
